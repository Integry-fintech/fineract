name: Publish Image to Amazon ECR

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Extra tag to publish alongside the branch and commit tags'
        required: false
        type: string
      platforms:
        description: 'Target platforms, comma separated (e.g. linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'
        type: string
      deploy:
        description: 'Redeploy the ECS service after publishing the image'
        required: false
        default: true
        type: boolean

concurrency:
  # Keyed on the ref so that main and staging never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # main deploys to production, every other ref to staging. The environment
    # supplies the cluster, service and credentials, so the same variable names
    # resolve to different values per environment and the branches can never
    # deploy into each other's infrastructure.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - name: Validate workflow configuration
        env:
          MISSING_REGION: ${{ vars.AWS_REGION == '' }}
          MISSING_REPOSITORY: ${{ vars.ECR_REPOSITORY == '' }}
          MISSING_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID == '' }}
          MISSING_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY == '' }}
          MISSING_CLUSTER: ${{ vars.ECS_CLUSTER == '' }}
          MISSING_SERVICE: ${{ vars.ECS_SERVICE == '' }}
          WILL_DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          set -euo pipefail
          failed=0

          echo "Target environment: $ENVIRONMENT"

          if [ "$MISSING_REGION" = 'true' ]; then
            echo '::error::Repository variable AWS_REGION is not set.'
            failed=1
          fi
          if [ "$MISSING_REPOSITORY" = 'true' ]; then
            echo '::error::Repository variable ECR_REPOSITORY is not set.'
            failed=1
          fi
          if [ "$MISSING_KEY_ID" = 'true' ]; then
            echo '::error::Repository secret AWS_ACCESS_KEY_ID is not set.'
            failed=1
          fi
          if [ "$MISSING_SECRET_KEY" = 'true' ]; then
            echo '::error::Repository secret AWS_SECRET_ACCESS_KEY is not set.'
            failed=1
          fi

          # Only required when this run is going to deploy.
          if [ "$WILL_DEPLOY" = 'true' ]; then
            if [ "$MISSING_CLUSTER" = 'true' ]; then
              echo "::error::Variable ECS_CLUSTER is not set in the '$ENVIRONMENT' environment."
              failed=1
            fi
            if [ "$MISSING_SERVICE" = 'true' ]; then
              echo "::error::Variable ECS_SERVICE is not set in the '$ENVIRONMENT' environment."
              failed=1
            fi
          fi

          exit "$failed"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history and tags are required: the gitVersioning plugin and the
          # generateGitProperties task both read them, and git.properties is what
          # feeds the /actuator/info endpoint inside the image.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-read-only: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Verify the ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::ECR repository '$ECR_REPOSITORY' was not found in region '$AWS_REGION'."
            echo "::error::Create it first; this workflow deliberately has no ecr:CreateRepository permission."
            exit 1
          fi

      - name: Compute image tags
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"

          # The commit tag is the immutable one; deployments should reference it
          # (or the digest). The branch tag is a moving pointer for convenience.
          tags="$short_sha,$BRANCH"
          if [ "$BRANCH" = 'main' ]; then
            tags="$tags,latest"
          fi
          if [ -n "$EXTRA_TAG" ]; then
            tags="$tags,$EXTRA_TAG"
          fi

          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing tags: $tags"

      - name: Build Avro Java SDK
        run: ./gradlew --no-daemon --console=plain :fineract-avro-schemas:buildJavaSdk

      - name: Build and push the image to Amazon ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
        run: |
          set -euo pipefail

          # Explicit credentials rather than relying on ~/.docker/config.json: for
          # *.amazonaws.com registries Jib first tries the docker-credential-ecr-login
          # helper, which is not installed on GitHub runners.
          ecr_password="$(aws ecr get-login-password --region "$AWS_REGION")"

          ./gradlew --no-daemon --console=plain :fineract-provider:jib \
            -x test -x cucumber -x buildJavaSdk \
            -Djib.to.image="${REGISTRY}/${ECR_REPOSITORY}" \
            -Djib.to.tags="$TAGS" \
            -Djib.to.auth.username=AWS \
            -Djib.to.auth.password="$ecr_password" \
            -Djib.from.platforms="$PLATFORMS"

      - name: Deploy to Amazon ECS
        id: deploy
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        run: |
          set -euo pipefail

          # force-new-deployment restarts the service so that it pulls its image
          # tag again. It does NOT choose the tag: that comes from the task
          # definition, which must therefore reference a moving tag (the branch
          # tag or latest), never an immutable per-commit one.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment > /dev/null

          echo "Deployment triggered on $ECS_CLUSTER/$ECS_SERVICE. Waiting for the service to stabilise..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Service is stable."

      - name: Report the published image
        if: always() && steps.meta.outputs.short_sha != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$SHORT_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ "$DEPLOYED" = 'true' ]; then
            deploy_row="| Deployment | \`${ECS_CLUSTER}\` / \`${ECS_SERVICE}\` — stable |"
          else
            deploy_row='| Deployment | not performed |'
          fi

          {
            echo '### Image published to Amazon ECR'
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Repository | \`${REGISTRY}/${ECR_REPOSITORY}\` |"
            echo "| Tags | \`${TAGS}\` |"
            echo "| Platforms | \`${PLATFORMS}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "$deploy_row"
            echo ''
            echo 'Reference the digest for reproducible deployments:'
            echo ''
            echo '```'
            echo "${REGISTRY}/${ECR_REPOSITORY}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
